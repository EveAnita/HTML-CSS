<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>Formulário</title>
</head>
<body>
    <h1>Meu primeiro formulário</h1>

    <form autocomplete="off" action="cadastro.java" method="post">
        <p><label for="nome">Nome:</label> <input placeholder="Write your name" type="text" name="nome" id="nome"></p>

        <p><label for="sobrenome">Sobrenome:</label> <input placeholder="Write your last name" type="text" name="sobrenome" id="sobrenome"></p>
        
        <input type="submit" value="Enviar" class="submit">
        <input type="reset" value="Limpar" class="submit">
    </form>
